<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242837;
  --border: #2e3347;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --green: #00b894;
  --red: #e17055;
  --orange: #fdcb6e;
  --text: #dfe6e9;
  --text2: #b2bec3;
  --white: #ffffff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.app { max-width:1200px; margin:0 auto; padding:20px; }
.header { text-align:center; padding:30px 0 20px; border-bottom:1px solid var(--border); margin-bottom:30px; }
.header h1 { font-size:28px; color:var(--white); margin-bottom:8px; }
.header p { color:var(--text2); font-size:14px; }
.progress-bar { display:flex; gap:4px; margin:20px 0 30px; }
.progress-step { flex:1; height:6px; border-radius:3px; background:var(--surface2); cursor:pointer; transition:background .3s; }
.progress-step.active { background:var(--accent); }
.progress-step.done { background:var(--green); }
.step { display:none; }
.step.active { display:block; }
.step-title { font-size:22px; color:var(--white); margin-bottom:6px; }
.step-desc { color:var(--text2); font-size:14px; margin-bottom:24px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:20px; }
.card-title { font-size:16px; font-weight:600; color:var(--accent2); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.card-title .badge { background:var(--accent); color:#fff; font-size:11px; padding:2px 8px; border-radius:10px; }
.card-title .badge.locked { background:var(--red); }
.row { display:grid; gap:16px; margin-bottom:16px; }
.row.c2 { grid-template-columns:1fr 1fr; }
.row.c3 { grid-template-columns:1fr 1fr 1fr; }
.row.c4 { grid-template-columns:1fr 1fr 1fr 1fr; }
@media(max-width:768px) { .row.c2,.row.c3,.row.c4 { grid-template-columns:1fr; } }
label { display:block; font-size:13px; color:var(--text2); margin-bottom:4px; }
input,select,textarea { width:100%; padding:10px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
input:focus,select:focus,textarea:focus { border-color:var(--accent); }
input[readonly] { opacity:.7; cursor:default; }
textarea { resize:vertical; min-height:80px; }
.calc-field { background:var(--bg); border-color:var(--accent); color:var(--green); font-weight:600; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:var(--surface2); color:var(--accent2); padding:10px 8px; text-align:left; font-weight:600; position:sticky; top:0; }
td { padding:8px; border-bottom:1px solid var(--border); }
td input { padding:6px 8px; font-size:13px; }
.table-scroll { overflow-x:auto; max-height:500px; overflow-y:auto; }
.btn-row { display:flex; gap:12px; justify-content:space-between; margin-top:30px; padding-top:20px; border-top:1px solid var(--border); flex-wrap:wrap; }
.btn { padding:12px 28px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent2); }
.btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { background:var(--border); }
.btn-success { background:var(--green); color:#fff; }
.btn-danger { background:var(--red); color:#fff; }
.autosave-indicator { position:fixed; top:16px; right:16px; padding:6px 14px; border-radius:20px; font-size:12px; background:var(--surface); border:1px solid var(--border); color:var(--text2); z-index:100; transition:all .3s; }
.autosave-indicator.saving { border-color:var(--orange); color:var(--orange); }
.autosave-indicator.saved { border-color:var(--green); color:var(--green); }
.tabs { display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
.tab { padding:8px 16px; border-radius:8px 8px 0 0; background:var(--surface2); color:var(--text2); cursor:pointer; font-size:13px; border:1px solid var(--border); border-bottom:none; transition:all .2s; }
.tab.active { background:var(--surface); color:var(--accent2); }
.tab-content { display:none; }
.tab-content.active { display:block; }
.chart-container { position:relative; height:300px; margin:16px 0; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:20px; }
.kpi-card { background:var(--surface2); border-radius:10px; padding:16px; text-align:center; }
.kpi-value { font-size:28px; font-weight:700; color:var(--green); }
.kpi-label { font-size:12px; color:var(--text2); margin-top:4px; }
.responsibility-matrix td { vertical-align:top; }
.task-tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; margin:2px; }
.task-tag.plan { background:#6c5ce733; color:var(--accent2); }
.task-tag.progress { background:#fdcb6e33; color:var(--orange); }
.task-tag.done { background:#00b89433; color:var(--green); }
.task-tag.overdue { background:#e1705533; color:var(--red); }
.status-select { padding:4px 8px; font-size:12px; width:auto; }
.collapsible { cursor:pointer; user-select:none; }
.collapsible::before { content:'▸ '; transition:transform .2s; }
.collapsible.open::before { content:'▾ '; }
.collapsible-body { display:none; padding-top:12px; }
.collapsible.open + .collapsible-body { display:block; }
.tooltip { position:relative; }
.tooltip:hover::after { content:attr(data-tip); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--surface2); color:var(--text); padding:6px 10px; border-radius:6px; font-size:12px; white-space:nowrap; z-index:10; border:1px solid var(--border); }
</style>
</head>

<script>
// ============================================================
// STEP DEFINITIONS
// ============================================================
function fmt(n) { return Number(n).toLocaleString('ru-RU'); }
function pct(n) { return Number(n).toFixed(1)+'%'; }

function renderStep1() {
  const g = state.general;
  let teamRows = g.team.map((t,i)=>`
    <div class="row c2">
      <div><label>Имя</label><input value="${t.name}" onchange="state.general.team[${i}].name=this.value;save()"></div>
      <div><label>Роль</label><input value="${t.role}" onchange="state.general.team[${i}].role=this.value;save()"></div>
    </div>`).join('');

  let kpiRows = state.kpi_2026.map((k,i)=>{
    let rooms = g.rooms_current;
    let days = DAYS_IN_MONTH[i];
    let rev = k.revpar * rooms * days;
    let bMin = rev * (g.drr_min/100);
    let bMax = rev * (g.drr_max/100);
    return `<tr>
      <td>${k.m}</td>
      <td><input type="number" value="${k.revpar}" onchange="state.kpi_2026[${i}].revpar=+this.value;renderCurrentStep();save()"></td>
      <td><input type="number" value="${k.occ}" onchange="state.kpi_2026[${i}].occ=+this.value;renderCurrentStep();save()">%</td>
      <td><input type="number" value="${k.adr}" onchange="state.kpi_2026[${i}].adr=+this.value;renderCurrentStep();save()"></td>
      <td class="calc-field">${fmt(Math.round(rev))}</td>
      <td class="calc-field">${fmt(Math.round(bMin))} – ${fmt(Math.round(bMax))}</td>
    </tr>`;
  }).join('');

  let totalRev = state.kpi_2026.reduce((s,k,i)=>s+k.revpar*g.rooms_current*DAYS_IN_MONTH[i],0);

  return `
  <h2 class="step-title">Шаг 1. Общие данные и цели</h2>
  <p class="step-desc">Динамические параметры объекта — обновляйте при изменениях</p>

  <div class="card">
    <div class="card-title">Номерной фонд и бюджет</div>
    <div class="row c4">
      <div><label>Номеров сейчас</label><input type="number" value="${g.rooms_current}" onchange="state.general.rooms_current=+this.value;renderCurrentStep();save()"></div>
      <div><label>Цель к концу года</label><input type="number" value="${g.rooms_target}" onchange="state.general.rooms_target=+this.value;save()"></div>
      <div><label>Бюджет (мес, всё)</label><input type="number" value="${g.budget_monthly}" onchange="state.general.budget_monthly=+this.value;save()"></div>
      <div><label>ФОТ</label><input type="number" value="${g.fot}" onchange="state.general.fot=+this.value;save()"></div>
    </div>
    <div class="row c4">
      <div><label>Свободный бюджет</label><input class="calc-field" readonly value="${fmt(g.budget_monthly - g.fot)} ₽"></div>
      <div><label>ДРР мин %</label><input type="number" value="${g.drr_min}" step="0.5" onchange="state.general.drr_min=+this.value;renderCurrentStep();save()"></div>
      <div><label>ДРР макс %</label><input type="number" value="${g.drr_max}" step="0.5" onchange="state.general.drr_max=+this.value;renderCurrentStep();save()"></div>
      <div><label>Пересмотр бюджета</label><input type="date" value="${g.budget_review_date}" onchange="state.general.budget_review_date=this.value;save()"></div>
    </div>
    <div class="row c2">
      <div><label>RevPAR цель (среднегод.)</label><input type="number" value="${g.revpar_target}" onchange="state.general.revpar_target=+this.value;save()"></div>
      <div><label>Выручка цель (расчёт)</label><input class="calc-field" readonly value="${fmt(Math.round(totalRev))} ₽"></div>
    </div>
  </div>

  <div class="card">

const STEP_NAMES = ['Общие данные','Факт 2025','Диджитал','Продукт','OTA и процессы','Стратегия','Результат'];

function renderProgressBar() {
  let html = '';
  for(let i=0;i<STEP_RENDERERS.length;i++) {
    let cls = i===state.step?'active':(i<state.step?'done':'');
    html += `<div class="progress-step ${cls}" onclick="goToStep(${i})" title="${STEP_NAMES[i]}"></div>`;
  }
  document.getElementById('progressBar').innerHTML = html;
}

function renderCurrentStep() {
  let container = document.getElementById('stepsContainer');
  container.innerHTML = `<div class="step active">${STEP_RENDERERS[state.step]()}</div>`;
  renderProgressBar();
  if(state.step===6) renderCharts();
}

function nextStep() { if(state.step<STEP_RENDERERS.length-1){state.step++;renderCurrentStep();save();window.scrollTo(0,0);} }
function prevStep() { if(state.step>0){state.step--;renderCurrentStep();save();window.scrollTo(0,0);} }
function goToStep(i) { state.step=i;renderCurrentStep();save();window.scrollTo(0,0); }

// ============================================================
// SAVE / LOAD
// ============================================================
const STORAGE_KEY = 'nort_km_roadmap_2026';

function save() {
  let ind = document.getElementById('saveIndicator');
  ind.textContent='Сохранение...'; ind.className='autosave-indicator saving';
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  setTimeout(()=>{ind.textContent='✓ Сохранено'; ind.className='autosave-indicator saved';},300);
  setTimeout(()=>{ind.textContent='Автосохранение'; ind.className='autosave-indicator';},2000);
}

function loadState() {
  let saved = localStorage.getItem(STORAGE_KEY);
  if(saved) {
    try {
      let parsed = JSON.parse(saved);
      // Deep merge to keep new fields from default state
      state = deepMerge(state, parsed);
    } catch(e) { console.warn('Load error',e); }
  }
}

function deepMerge(target, source) {
  let result = {...target};
  for(let key in source) {
    if(source[key] && typeof source[key]==='object' && !Array.isArray(source[key]) && typeof target[key]==='object' && !Array.isArray(target[key])) {
      result[key] = deepMerge(target[key], source[key]);
    } else {
      result[key] = source[key];
    }
  }
  return result;
}

function saveToFile() {
  let blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nort_km_roadmap_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function loadFromFile() { document.getElementById('fileInput').click(); }
function handleFileLoad(e) {
  let file = e.target.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(ev) {
    try {
      let parsed = JSON.parse(ev.target.result);
      state = deepMerge(state, parsed);
      renderCurrentStep();
      save();
      alert('Данные загружены!');
    } catch(err) { alert('Ошибка чтения файла'); }
  };
  reader.readAsText(file);
}
